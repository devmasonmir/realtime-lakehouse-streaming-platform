name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install pytest flake8 pydantic
      - run: flake8 src/ tests/ --max-line-length=120
      - run: pytest tests/ -v
